name: Phone Shop CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-shop-production
  cancel-in-progress: false

jobs:
  backend:
    name: Build Spring Boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phoneshop-backend
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v6

      - name: Cai Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: phoneshop-backend/pom.xml

      - name: Build va chay unit test
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: Build Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phoneshop-frontend
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v6

      - name: Cai Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: phoneshop-frontend/package-lock.json

      - name: Cai dependency dung theo package-lock
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_UPLOAD_URL: /uploads

  deploy:
    name: Deploy production VM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - frontend
    runs-on:
      - self-hosted
      - linux
      - x64
      - phone-shop
    timeout-minutes: 30
    steps:
      - name: Trien khai dung commit da qua CI
        run: sudo -n /usr/local/sbin/deploy-phone-shop "${GITHUB_SHA}"
