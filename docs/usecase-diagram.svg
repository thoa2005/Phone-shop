<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Use case tổng quát hệ thống PhoneShop</title>
  <desc id="desc">Sơ đồ gồm bốn tác nhân: Khách, Khách hàng, Quản trị viên và Cổng VNPay; cùng mười bốn use case của hệ thống.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 32px Arial,sans-serif;fill:#172554}.subtitle{font:16px Arial,sans-serif;fill:#475569}
      .boundary{fill:#fff;stroke:#2563eb;stroke-width:2.5}.boundary-title{font:700 21px Arial,sans-serif;fill:#fff}
      .uc{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.uc-admin{fill:#fef3c7;stroke:#d97706;stroke-width:2}
      .label{font:15px Arial,sans-serif;fill:#172554;text-anchor:middle}.small{font:italic 13px Arial,sans-serif;fill:#475569;text-anchor:middle}
      .actor{fill:#fff;stroke:#334155;stroke-width:3}.actor-label{font:700 17px Arial,sans-serif;fill:#0f172a;text-anchor:middle}
      .link{fill:none;stroke:#94a3b8;stroke-width:1.7}.include{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="800" y="45" class="title" text-anchor="middle">USE CASE TỔNG QUÁT — PHONESHOP</text>
  <text x="800" y="72" class="subtitle" text-anchor="middle">Phạm vi chức năng phục vụ thiết kế testcase an toàn và đảm bảo chất lượng phần mềm</text>

  <!-- system boundary -->
  <rect x="245" y="100" width="1110" height="830" rx="24" class="boundary" filter="url(#shadow)"/>
  <rect x="570" y="84" width="460" height="38" rx="19" fill="#2563eb"/>
  <text x="800" y="110" class="boundary-title" text-anchor="middle" fill="#fff">HỆ THỐNG PHONESHOP</text>

  <!-- relationship lines, placed behind use cases -->
  <g opacity=".75">
    <path class="link" d="M155 245 C230 245 260 190 355 190"/><path class="link" d="M155 245 C235 245 275 295 355 295"/><path class="link" d="M155 245 C230 245 270 400 355 400"/>
    <path class="link" d="M155 650 C235 650 270 190 355 190"/><path class="link" d="M155 650 C235 650 275 295 355 295"/><path class="link" d="M155 650 C250 650 290 505 355 505"/><path class="link" d="M155 650 C250 650 295 610 355 610"/><path class="link" d="M155 650 C250 650 295 715 355 715"/><path class="link" d="M155 650 C250 650 290 820 355 820"/>
    <path class="link" d="M1450 430 C1385 430 1330 190 1245 190"/><path class="link" d="M1450 430 C1385 430 1330 295 1245 295"/><path class="link" d="M1450 430 C1385 430 1330 400 1245 400"/><path class="link" d="M1450 430 C1385 430 1330 505 1245 505"/><path class="link" d="M1450 430 C1385 430 1330 610 1245 610"/>
    <path class="link" d="M1450 790 C1375 790 1325 715 1245 715" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>

  <!-- public/customer use cases -->
  <g>
    <ellipse cx="530" cy="190" rx="175" ry="48" class="uc"/><text x="530" y="186" class="label"><tspan x="530">Xem / tìm kiếm / lọc</tspan><tspan x="530" dy="19">sản phẩm</tspan></text>
    <ellipse cx="530" cy="295" rx="175" ry="48" class="uc"/><text x="530" y="291" class="label"><tspan x="530">Xem danh mục, thương hiệu</tspan><tspan x="530" dy="19">và chi tiết sản phẩm</tspan></text>
    <ellipse cx="530" cy="400" rx="175" ry="48" class="uc"/><text x="530" y="396" class="label"><tspan x="530">Đăng ký / đăng nhập</tspan><tspan x="530" dy="19">/ refresh token</tspan></text>
    <ellipse cx="530" cy="505" rx="175" ry="48" class="uc"/><text x="530" y="510" class="label">Quản lý giỏ hàng 🔒</text>
    <ellipse cx="530" cy="610" rx="175" ry="48" class="uc"/><text x="530" y="615" class="label">Hồ sơ và địa chỉ 🔒</text>
    <ellipse cx="530" cy="715" rx="175" ry="48" class="uc"/><text x="530" y="720" class="label">Đặt hàng, áp coupon 🔒</text>
    <ellipse cx="530" cy="820" rx="175" ry="48" class="uc"/><text x="530" y="825" class="label">Xem đơn hàng 🔒</text>
  </g>

  <!-- customer/admin use cases -->
  <g>
    <ellipse cx="1070" cy="190" rx="175" ry="48" class="uc-admin"/><text x="1070" y="195" class="label">Dashboard 👑</text>
    <ellipse cx="1070" cy="295" rx="175" ry="48" class="uc-admin"/><text x="1070" y="300" class="label">Quản lý sản phẩm 👑</text>
    <ellipse cx="1070" cy="400" rx="175" ry="48" class="uc-admin"/><text x="1070" y="405" class="label">Quản lý đơn hàng 👑</text>
    <ellipse cx="1070" cy="505" rx="175" ry="48" class="uc-admin"/><text x="1070" y="501" class="label"><tspan x="1070">Quản lý người dùng</tspan><tspan x="1070" dy="19">và coupon 👑</tspan></text>
    <ellipse cx="1070" cy="610" rx="175" ry="48" class="uc-admin"/><text x="1070" y="596" class="label"><tspan x="1070">Quản lý danh mục, hãng</tspan><tspan x="1070" dy="19">và đánh giá 👑</tspan></text>
    <ellipse cx="1070" cy="715" rx="175" ry="48" class="uc"/><text x="1070" y="720" class="label">Thanh toán COD / VNPay 🔒</text>
    <ellipse cx="1070" cy="820" rx="175" ry="48" class="uc"/><text x="1070" y="825" class="label">Viết đánh giá 🔒</text>
  </g>

  <!-- include relationships -->
  <path class="include" d="M700 700 C790 660 800 570 705 530"/><text x="790" y="613" class="small">«include»</text>
  <path class="include" d="M700 715 C790 715 800 640 705 620"/><text x="788" y="676" class="small">«include»</text>

  <!-- actors -->
  <g transform="translate(110 205)"><circle r="24" class="actor"/><path d="M0 24v72M-42 52H42M0 96l-35 58M0 96l35 58" class="actor" fill="none"/><text x="0" y="182" class="actor-label">Khách</text></g>
  <g transform="translate(110 610)"><circle r="24" class="actor"/><path d="M0 24v72M-42 52H42M0 96l-35 58M0 96l35 58" class="actor" fill="none"/><text x="0" y="182" class="actor-label">Khách hàng</text><text x="0" y="204" class="small">đã đăng nhập</text></g>
  <g transform="translate(1490 390)"><circle r="24" class="actor"/><path d="M0 24v72M-42 52H42M0 96l-35 58M0 96l35 58" class="actor" fill="none"/><text x="0" y="182" class="actor-label">Quản trị viên</text></g>
  <g transform="translate(1490 755)"><rect x="-62" y="-22" width="124" height="80" rx="12" fill="#fff" stroke="#334155" stroke-width="3"/><path d="M-42 0h84M-42 17h52" stroke="#2563eb" stroke-width="5"/><text x="0" y="90" class="actor-label">Cổng VNPay</text></g>

  <g transform="translate(450 902)"><rect width="700" height="22" rx="11" fill="#f8fafc"/><circle cx="20" cy="11" r="8" fill="#dbeafe" stroke="#2563eb"/><text x="38" y="16" font-family="Arial" font-size="13" fill="#475569">Chức năng chung / khách hàng</text><circle cx="245" cy="11" r="8" fill="#fef3c7" stroke="#d97706"/><text x="263" y="16" font-family="Arial" font-size="13" fill="#475569">Chức năng quản trị</text><text x="455" y="16" font-family="Arial" font-size="13" fill="#475569">🔒 yêu cầu đăng nhập · 👑 yêu cầu ADMIN</text></g>
</svg>
